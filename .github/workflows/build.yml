name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build PdfFormFiller.sln -c Release

      # Packing here catches packaging errors (metadata, missing files, dependency versions) on every PR.
      # The output goes to a temp folder and is discarded.
      - name: Pack
        env:
          OUT: ${{ runner.temp }}/nupkg
        run: |
          dotnet pack src/PdfFormFiller/PdfFormFiller.csproj -c Release --no-build -o "$OUT"
          dotnet pack src/PdfFormFiller.Widgets/PdfFormFiller.Widgets.csproj -c Release --no-build -o "$OUT"
          dotnet pack src/PdfFormFiller.Reports/PdfFormFiller.Reports.csproj -c Release --no-build -o "$OUT"
          ls -l "$OUT"
