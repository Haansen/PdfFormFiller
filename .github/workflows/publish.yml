name: Publish packages

# Runs when a version tag such as v1.0.0 is pushed. The tag decides the package version.
on:
  push:
    tags:
      - "v*"

# Read-only by default; the publish job below gets the write scopes it needs.
permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub release
      packages: write   # push to GitHub Packages
    env:
      OWNER: ${{ github.repository_owner }}
      TAG: ${{ github.ref_name }}
      HAS_NUGET_KEY: ${{ secrets.NUGET_API_KEY != '' }}
    steps:
      # Fail before anything is built or published if the tag is not a version.
      - name: Version from tag
        run: |
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "::error::Tag '$TAG' is not a version tag. Use the form v1.2.3 or v1.2.3-beta.1"
            exit 1
          fi
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build PdfFormFiller.sln -c Release -p:Version="$VERSION"

      - name: Pack
        run: |
          dotnet pack src/PdfFormFiller/PdfFormFiller.csproj -c Release --no-build -p:Version="$VERSION" -o nupkg
          dotnet pack src/PdfFormFiller.Widgets/PdfFormFiller.Widgets.csproj -c Release --no-build -p:Version="$VERSION" -o nupkg

      - name: Push to GitHub Packages
        env:
          NUGET_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet nuget push "nupkg/*.nupkg" --source "https://nuget.pkg.github.com/$OWNER/index.json" --api-key "$NUGET_TOKEN" --skip-duplicate

      - name: Attach packages to a GitHub release
        run: gh release create "$TAG" nupkg/*.nupkg --title "$TAG" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Only runs once a nuget.org API key has been added as the NUGET_API_KEY repository secret.
      # The secret is given to this step alone.
      - name: Push to nuget.org
        if: env.HAS_NUGET_KEY == 'true'
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: dotnet nuget push "nupkg/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
